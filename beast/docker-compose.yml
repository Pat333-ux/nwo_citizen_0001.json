# Local development only. Replace the placeholder secrets via environment/secret manager.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: beast
    volumes:
      - ./db/001_ledger.sql:/docker-entrypoint-initdb.d/001_ledger.sql:ro
      - ./db/002_cases.sql:/docker-entrypoint-initdb.d/002_cases.sql:ro
      - ./db/003_users.sql:/docker-entrypoint-initdb.d/003_users.sql:ro
  api:
    build: .
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/beast
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      PII_KEY_HEX: ${PII_KEY_HEX:?set PII_KEY_HEX (64 hex chars)}
      POVERTY_LEVEL_MONTHLY: ${POVERTY_LEVEL_MONTHLY:?set program poverty level}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
